[package]
name = "garmin-connect"
version = "0.1.0"
edition = "2021"
description = "Rust client for Garmin Connect, with browser TLS/JA3/JA4 impersonation (wreq)"
license = "MIT"

[dependencies]
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
wreq = { version = "6.0.0-rc.31", features = ["json", "cookies", "query", "form"] }
wreq-util = "3.0.0-rc.14"

[dev-dependencies]
anyhow = "1"
serde_json = "1"
tracing-subscriber = "0.3"
